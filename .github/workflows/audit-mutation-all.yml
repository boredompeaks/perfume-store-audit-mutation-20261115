name: audit-mutation-all

# One-time, pre-launch mutation campaign. NOT a merge gate.
# Sharded by flow/cohesion so no single job carries the whole suite.
# Public scratch repo: GitHub-hosted runner minutes are not capped for public
# repositories. Each job is independent; a survivor is information, not a red
# build. A non-zero exit means the harness broke (red baseline, missing tool).

on:
  workflow_dispatch:
    inputs:
      shard:
        description: "Optional single shard name; empty = all shards"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      count: ${{ steps.set.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        shell: bash
        run: |
          set -euo pipefail
          SHARD="${{ github.event.inputs.shard }}"
          if [ -z "${SHARD}" ]; then
            jq -c '{include: .}' .github/mutation-shards.json > /tmp/matrix.json
          else
            jq -c --arg s "${SHARD}" '{include: [.[] | select(.name == $s)]}' .github/mutation-shards.json > /tmp/matrix.json
          fi
          count="$(jq '.include | length' /tmp/matrix.json)"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          echo "matrix=$(cat /tmp/matrix.json)" >> "${GITHUB_OUTPUT}"
          cat /tmp/matrix.json

  mutate:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "audit-ci-only-not-a-secret"
      REDIS_URL: "redis://localhost:6379/0"
      DATABASE_URL: "sqlite:////tmp/mutation.sqlite3"
      RAZORPAY_KEY_ID: "rzp_test_CI_DUMMY"
      RAZORPAY_KEY_SECRET: "ci-dummy-secret"
      RAZORPAY_WEBHOOK_SECRET: "ci-dummy-webhook-secret"
      ALERT_CACHE_LOCATION: "/tmp/alert_cache"
      EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
      PYTHONIOENCODING: "utf-8"
      TEST_LABELS: ${{ matrix.tests }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pinned dependencies (includes mutmut==2.5.1)
        run: pip install -r requirements.txt

      - name: Copy backend/ into an out-of-tree sandbox
        shell: bash
        run: |
          set -euo pipefail
          SANDBOX="${RUNNER_TEMP}/mutation-sandbox"
          rm -rf "${SANDBOX}"
          mkdir -p "${SANDBOX}"
          tar -C backend --exclude=.git --exclude=venv --exclude=__pycache__ -cf - . | tar -C "${SANDBOX}" -xf -
          test -f "${SANDBOX}/manage.py"

      - name: Scope this shard
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/mutation-sandbox"
          PATHS="$(find ${{ matrix.roots }} \
            -name '*.py' \
            ! -path '*/migrations/*' \
            ! -path '*/__pycache__/*' \
            ! -path '*/tests/*' \
            ! -name '__init__.py' \
            ! -name 'test_*.py' \
            ! -name 'tests*.py' | sort | paste -sd, -)"
          if [ -z "${PATHS}" ]; then echo "no mutable paths for shard"; exit 1; fi
          echo "shard=${{ matrix.name }}"
          echo "paths=${PATHS}"
          python - "$PATHS" <<'PY'
          import pathlib, sys
          p = pathlib.Path('pyproject.toml')
          s = p.read_text()
          paths = sys.argv[1]
          out = []
          replaced = False
          for line in s.splitlines():
              if line.startswith('paths_to_mutate = '):
                  out.append(f'paths_to_mutate = "{paths}"')
                  replaced = True
              else:
                  out.append(line)
          if not replaced:
              raise SystemExit('paths_to_mutate not found')
          p.write_text('\n'.join(out) + '\n')
          PY

      - name: Coverage baseline for this shard
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/mutation-sandbox"
          mkdir -p /tmp/alert_cache
          python -m coverage run manage.py test ${TEST_LABELS} --verbosity 0
          test -f .coverage

      - name: Run mutmut (not a gate; --CI exits 0 on survivors)
        id: mutate
        shell: bash
        run: |
          set -uo pipefail
          cd "${RUNNER_TEMP}/mutation-sandbox"
          python -m mutmut run \
            --runner "python manage.py test ${TEST_LABELS} --verbosity 0" \
            --CI
          status=$?
          echo "mutmut_exit=${status}"
          exit "${status}"

      - name: Publish shard summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          cd "${RUNNER_TEMP}/mutation-sandbox"
          mkdir -p /tmp/alert_cache
          python -m mutmut html >/dev/null 2>&1 || true
          index="html/index.html"
          {
            echo "### audit-mutation-all — ${{ matrix.name }}"
            echo
            echo "Roots: \`${{ matrix.roots }}\`"
            echo "Tests: \`${{ matrix.tests }}\`"
            if [ -f "$index" ]; then
              headline="$(grep -ao 'Killed [0-9]* out of [0-9]* mutants' "$index" | head -n1 || true)"
              echo "Result: \`${headline:-unparsed}\`"
            else
              echo "Result: **NO REPORT** (harness failure, not a zero score)"
            fi
            echo
            echo "Survivors are information. Triage each one as equivalent / missing assert / untested line / flaky / timeout."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Assert the checkout is untouched
        if: always()
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain)"
          if [ -n "${dirty}" ]; then
            echo "::error::mutation run wrote into the tree: ${dirty}"
            exit 1
          fi

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/mutation-sandbox/html/
            ${{ runner.temp }}/mutation-sandbox/mutants/
            ${{ runner.temp }}/mutation-sandbox/.mutmut-cache
          if-no-files-found: ignore
          retention-days: 14

  frontend-mutate:
    if: ${{ github.event.inputs.shard == '' || github.event.inputs.shard == 'frontend-lib' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save @stryker-mutator/core @stryker-mutator/vitest-runner
      - run: npx stryker run
      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-frontend-lib
          path: frontend/reports/mutation/
          if-no-files-found: ignore
          retention-days: 14
